services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hirepilot
      POSTGRES_USER: hirepilot
      POSTGRES_PASSWORD: hirepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirepilot -d hirepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://hirepilot:hirepilot@db:5432/hirepilot?sslmode=disable
      HTTP_ADDR: :8080
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "8080:8080"
    volumes:
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
